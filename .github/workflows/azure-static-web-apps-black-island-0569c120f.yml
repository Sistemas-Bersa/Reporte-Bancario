name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      # Pre-construir el cliente con Node propio. Evita que Oryx comprima el
      # node_modules pesado del cliente (tesseract.js/pdfjs) y crashee con
      # "Destination is too short". Ver skip_app_build abajo.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Build client
        run: |
          cd client
          npm ci
          npm run build

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_ISLAND_0569C120F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # Apuntar directo a dist (1.7 MB) para NO subir client/node_modules
          # (~112 MB), que junto al API excedía el límite de 250 MB del plan Free.
          app_location: "client/dist"
          api_location: "server"
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_ISLAND_0569C120F }}
          action: "close"
